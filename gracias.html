<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Mensaje enviado! — Ads.Not.Dead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #191918;
      --accent: #F5C841;
      --accent-dim: rgba(245, 200, 65, 0.1);
      --accent-border: rgba(245, 200, 65, 0.2);
      --text: #f0ede8;
      --text-muted: #888883;
      --border: rgba(255,255,255,0.06);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 2rem;
    }

    .box {
      text-align: center;
      max-width: 480px;
      animation: fadeUp 0.7s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 2rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    h1 span { color: var(--accent); }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 2rem;
    }

    a.back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #111;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    a.back:hover {
      background: #f7d05a;
      transform: translateY(-2px);
    }

    .logo {
      position: fixed;
      top: 1.5rem;
      left: 1.75rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }
  </style>
</head>
<body>

  <div class="logo">Ads<span>.</span>Not<span>.</span>Dead</div>

  <div class="box">
    <div class="icon">✅</div>
    <h1>¡Mensaje<br><span>enviado!</span></h1>
    <p>
      Recibimos tu consulta. Te responderemos en menos de 24 horas hábiles.
      Mientras tanto, puedes escribirnos directo por WhatsApp.
    </p>
    <a href="/" class="back">← Volver al inicio</a>
  </div>

</body>
</html>
